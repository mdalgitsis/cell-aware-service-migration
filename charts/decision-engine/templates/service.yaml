apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  type: NodePort
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: server
      protocol: TCP
      port: 8880
      targetPort: 8880
      nodePort: {{ .Values.service.nodePort }}
