apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: statictables.example.com
spec:
  group: example.com
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                mappings:
                  type: array
                  items:
                    type: object
                    properties:
                      gnbId:
                        type: integer
                      siteId:
                        type: string
            status:
              type: object
              properties:
                valid:
                  type: boolean
  scope: Namespaced
  names:
    plural: statictables
    singular: statictable
    kind: StaticTable
    shortNames:
      - st
