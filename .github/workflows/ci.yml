name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r decision-engine/app/requirements.txt
          pip install -r tests/requirements.txt
          pip install ruff
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests
        run: python -m pytest tests/ -v

  validate:
    name: yaml and diagrams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      - name: Validate YAML, CRDs, topology and Mermaid
        run: python scripts/validate.py

  helm:
    name: helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint charts
        run: |
          for chart in charts/*/; do
            helm lint "$chart"
          done
      - name: Render charts
        run: |
          for chart in charts/*/; do
            helm template test "$chart" > /dev/null
          done
      - name: Rendered topology must satisfy the engine's schema
        run: |
          pip install PyYAML
          helm template de charts/decision-engine \
            | python -c "
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(sys.stdin) if d and d.get('kind') == 'ConfigMap']
          assert docs, 'no ConfigMap rendered'
          open('topology.yaml', 'w').write(docs[0]['data']['topology.yaml'])
          "
          PYTHONPATH=decision-engine/app python -c "
          from config import load_topology
          print('rendered topology loads:', list(load_topology('topology.yaml')))
          "

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the decision engine image
        run: docker build -t cell-aware-decision-engine decision-engine/

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
